<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create a new password for your SmartPick Hub account.">
    <title>Reset Password | SmartPick Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header">
    <div class="navbar">
        <a class="logo" href="index.html">SmartPick Hub</a>
        <a href="index.html">Back to Home</a>
    </div>
</header>

<main class="auth-container">
    <section class="auth-card">
        <h1>Set a New Password</h1>
        <p>Choose a new password for your SmartPick Hub account.</p>

        <form id="reset-password-form">
            <label for="new-password">New Password</label>
            <input type="password" id="new-password"
                   autocomplete="new-password" minlength="8"
                   placeholder="At least 8 characters" required>

            <label for="confirm-new-password">Confirm New Password</label>
            <input type="password" id="confirm-new-password"
                   autocomplete="new-password" minlength="8"
                   placeholder="Enter the password again" required>

            <button type="submit" id="reset-submit" disabled>
                Update Password
            </button>
        </form>

        <p id="reset-message" role="status" aria-live="polite">
            Checking your password reset link...
        </p>
        <a href="auth.html">Return to Login</a>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="reset-password.js"></script>
</body>
</html>
